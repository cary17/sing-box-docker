services:
  sing-box:
    #image: cary17/sing-box:latest
    image: ghcr.io/cary17/sing-box:latest
    container_name: sing-box
    restart: unless-stopped
    network_mode: "host"
    environment:
      TZ: Asia/Shanghai
    cap_add:
      - NET_ADMIN
    security_opt:
      - no-new-privileges:true
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - ./conf:/etc/sing-box/
      - /run/dbus:/run/dbus:ro
    command: -D /var/lib/sing-box -C /etc/sing-box/ run
