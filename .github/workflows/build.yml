name: Build reF1nd Sing-Box Docker Images
run-name: 删除清理与验证工作流的历史记录

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: remove-obsolete-workflow-history
  cancel-in-progress: false

jobs:
  remove_history:
    name: 删除指定工作流运行记录
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
    steps:
      - name: 删除并验证历史记录
        shell: bash
        run: |
          set -euo pipefail
          records="$RUNNER_TEMP/obsolete-workflow-runs.tsv"
          query='.workflow_runs[] | select(.workflow_id == 319631166 or .workflow_id == 302700610) | [.id, .status, .workflow_id] | @tsv'
          gh api --paginate "repos/$REPOSITORY/actions/runs?per_page=100" --jq "$query" > "$records"
          deleted_ci=0
          deleted_cleanup=0
          while IFS=$'\t' read -r run_id status workflow_id; do
            [[ "$run_id" =~ ^[0-9]+$ ]] || exit 1
            case "$workflow_id" in
              319631166|302700610) ;;
              *) exit 1 ;;
            esac
            if [[ "$status" != completed ]]; then
              gh api --method POST "repos/$REPOSITORY/actions/runs/$run_id/cancel"
              for attempt in {1..30}; do
                status="$(gh api "repos/$REPOSITORY/actions/runs/$run_id" --jq '.status')"
                [[ "$status" == completed ]] && break
                echo "Waiting for run $run_id to stop ($attempt/30)"
                sleep 2
              done
              [[ "$status" == completed ]] || exit 1
            fi
            gh api --method DELETE "repos/$REPOSITORY/actions/runs/$run_id"
            echo "Deleted workflow $workflow_id run $run_id"
            if [[ "$workflow_id" == 319631166 ]]; then
              deleted_ci=$((deleted_ci + 1))
            else
              deleted_cleanup=$((deleted_cleanup + 1))
            fi
          done < "$records"
          gh api --paginate "repos/$REPOSITORY/actions/runs?per_page=100" --jq "$query" > "$RUNNER_TEMP/remaining-runs.tsv"
          [[ ! -s "$RUNNER_TEMP/remaining-runs.tsv" ]] || {
            echo 'Obsolete workflow runs remain' >&2
            exit 1
          }
          printf 'Deleted validation runs: %s\nDeleted cleanup runs: %s\nRemaining obsolete runs: 0\n' "$deleted_ci" "$deleted_cleanup" | tee -a "$GITHUB_STEP_SUMMARY"
