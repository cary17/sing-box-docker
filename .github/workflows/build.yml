name: Build reF1nd Sing-Box Docker Images

on:
  workflow_dispatch:
    inputs:
      force_build:
        description: "强制构建"
        required: false
        default: false
        type: boolean
      version:
        description: "指定版本（如 1.14.4 或 v1.15.0-alpha.13-reF1nd；留空检测最新）"
        required: false
        default: ""
        type: string
      branch:
        description: "选择分支"
        required: false
        default: "both"
        type: choice
        options:
          - both
          - stable
          - testing

permissions:
  contents: read

concurrency:
  # 各分支共享构建队列，避免并行更新相同镜像标签。
  group: build-sing-box
  cancel-in-progress: false
  # ponytail: 原生队列最多保留 100 个等待项，超出时需外部调度。
  queue: max

env:
  # 上游仓库配置
  UPSTREAM_REPO: "https://github.com/reF1nd/sing-box.git"
  UPSTREAM_STABLE_BRANCH: "reF1nd-stable"
  UPSTREAM_TESTING_BRANCH: "reF1nd-testing"
  UPSTREAM_RELEASES_REPO: "reF1nd/sing-box-releases"

  # 镜像仓库配置
  GHCR_IMAGE: "ghcr.io/${{ github.repository_owner }}/sing-box"
  DOCKERHUB_IMAGE: "cary17/sing-box"

jobs:
  # ==================== 检测版本 ====================
  check_versions:
    name: 检测上游版本
    runs-on: ubuntu-latest
    outputs:
      update_channel: ${{ steps.channel_update.outputs.update_channel }}
      stable_version: ${{ steps.stable_version.outputs.version }}
      stable_published_at: ${{ steps.stable_version.outputs.published_at }}
      stable_docker_tag: ${{ steps.stable_version.outputs.docker_tag }}
      testing_version: ${{ steps.testing_version.outputs.version }}
      testing_published_at: ${{ steps.testing_version.outputs.published_at }}
      testing_docker_tag: ${{ steps.testing_version.outputs.docker_tag }}
      stable_need_build: ${{ steps.stable_check.outputs.need_build }}
      testing_need_build: ${{ steps.testing_check.outputs.need_build }}
    steps:
      - name: Checkout Current Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: 解析构建版本与渠道
        id: build_request
        env:
          REQUESTED_VERSION: ${{ github.event.inputs.version }}
          SELECTED_BRANCH: ${{ github.event.inputs.branch || 'both' }}
        run: |
          CHANNEL="$SELECTED_BRANCH"
          REQUESTED_VERSION="${REQUESTED_VERSION#"${REQUESTED_VERSION%%[![:space:]]*}"}"
          REQUESTED_VERSION="${REQUESTED_VERSION%"${REQUESTED_VERSION##*[![:space:]]}"}"
          if [[ -n "$REQUESTED_VERSION" ]]; then
            REQUESTED_VERSION="v${REQUESTED_VERSION#[vV]}"
            if [[ "$REQUESTED_VERSION" != *-reF1nd* ]]; then
              REQUESTED_VERSION="${REQUESTED_VERSION}-reF1nd"
            fi
            source scripts/version-key.sh
            version_key "$REQUESTED_VERSION" >/dev/null
            BASE_VERSION="${REQUESTED_VERSION%%-reF1nd*}"
            CHANNEL=stable
            [[ "$BASE_VERSION" != *-* ]] || CHANNEL=testing
            if [[ "$SELECTED_BRANCH" != both && "$SELECTED_BRANCH" != "$CHANNEL" ]]; then
              echo "指定版本 $REQUESTED_VERSION 属于 $CHANNEL，与所选渠道 $SELECTED_BRANCH 不匹配" >&2
              exit 1
            fi
          fi
          {
            echo "channel=$CHANNEL"
            echo "version=$REQUESTED_VERSION"
          } >> "$GITHUB_OUTPUT"

      - name: 读取稳定版记录
        id: stable_local
        run: |
          RECORD_FILE=".github/version/stable.json"

          if [ -f "$RECORD_FILE" ]; then
            VERSION=$(jq -r '.version // ""' "$RECORD_FILE")
            PUBLISHED_AT=$(jq -r '.published_at // ""' "$RECORD_FILE")
          else
            VERSION=""
            PUBLISHED_AT=""
          fi

          {
            echo "version=${VERSION}"
            echo "published_at=${PUBLISHED_AT}"
          } >> "$GITHUB_OUTPUT"

      - name: 获取稳定版版本号
        id: stable_version
        if: steps.build_request.outputs.channel == 'both' || steps.build_request.outputs.channel == 'stable'
        env:
          LOCAL_VERSION: ${{ steps.stable_local.outputs.version }}
          REQUESTED_VERSION: ${{ steps.build_request.outputs.version }}
        run: |
          RELEASES_JSON="$RUNNER_TEMP/stable-releases.json"
          TAGS_JSON="$RUNNER_TEMP/stable-tags.json"
          TAG_PUBLISHED_AT="$(TZ=Asia/Shanghai date +'%Y-%m-%dT%H:%M:%S+08:00')"
          RELEASES_URL="https://api.github.com/repos/${{ env.UPSTREAM_RELEASES_REPO }}/releases?per_page=100"
          if [[ -n "$REQUESTED_VERSION" ]]; then
            RELEASES_URL="https://api.github.com/repos/${{ env.UPSTREAM_RELEASES_REPO }}/releases/tags/$REQUESTED_VERSION"
          fi

          curl -fsSL \
            --retry 3 \
            --retry-delay 2 \
            --retry-all-errors \
            --connect-timeout 15 \
            --max-time 120 \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$RELEASES_URL" \
            -o "$RELEASES_JSON"

          if SELECTED="$(bash scripts/select-upstream-version.sh stable "$RELEASES_JSON" "" "$LOCAL_VERSION" "$TAG_PUBLISHED_AT" "$REQUESTED_VERSION")"; then
            :
          else
            STATUS=$?
            if [[ "$STATUS" -ne 3 ]]; then
              exit "$STATUS"
            fi

            curl -fsSL \
              --retry 3 \
              --retry-delay 2 \
              --retry-all-errors \
              --connect-timeout 15 \
              --max-time 120 \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${{ github.token }}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${{ env.UPSTREAM_RELEASES_REPO }}/tags?per_page=100" \
              -o "$TAGS_JSON"

            SELECTED="$(bash scripts/select-upstream-version.sh stable "$RELEASES_JSON" "$TAGS_JSON" "$LOCAL_VERSION" "$TAG_PUBLISHED_AT" "$REQUESTED_VERSION")"
          fi

          VERSION="$(jq -r '.version' <<< "$SELECTED")"
          PUBLISHED_AT="$(jq -r '.published_at' <<< "$SELECTED")"
          DOCKER_TAG="$(jq -r '.docker_tag' <<< "$SELECTED")"
          SOURCE="$(jq -r '.source' <<< "$SELECTED")"

          {
            echo "version=${VERSION}"
            echo "published_at=${PUBLISHED_AT}"
            echo "docker_tag=${DOCKER_TAG}"
          } >> "$GITHUB_OUTPUT"
          echo "stable upstream version: ${VERSION}"
          echo "stable upstream published at: ${PUBLISHED_AT}"
          echo "stable upstream source: ${SOURCE}"
          echo "stable Docker tag: ${DOCKER_TAG}"

      - name: 检查稳定版是否需要构建
        id: stable_check
        if: steps.build_request.outputs.channel == 'both' || steps.build_request.outputs.channel == 'stable'
        env:
          REQUESTED_VERSION: ${{ steps.build_request.outputs.version }}
          SELECTED_BRANCH: ${{ github.event.inputs.branch || 'both' }}
          CURRENT: ${{ steps.stable_version.outputs.version }}
          LOCAL: ${{ steps.stable_local.outputs.version }}
        run: |
          NEED="false"

          source scripts/version-key.sh
          CURRENT_KEY="$(version_key "$CURRENT")"
          LOCAL_KEY=""
          if [[ -n "$LOCAL" && -z "${REQUESTED_VERSION:-}" ]]; then
            LOCAL_KEY="$(version_key "$LOCAL")"
          fi

          if [[ "$SELECTED_BRANCH" != "both" && "$SELECTED_BRANCH" != "stable" ]]; then
            echo "手动触发选择了 ${SELECTED_BRANCH}，跳过稳定版"
          elif [[ -n "$REQUESTED_VERSION" ]]; then
            NEED="true"
            echo "构建指定稳定版 $CURRENT"
          elif [[ "${{ github.event.inputs.force_build }}" == "true" ]]; then
            NEED="true"
            echo "强制构建稳定版"
          elif [[ "$CURRENT_KEY" > "$LOCAL_KEY" ]]; then
            NEED="true"
            echo "检测到稳定版新版本"
            echo "远程: $CURRENT"
            echo "本地: $LOCAL"
          elif [[ "$CURRENT" != "$LOCAL" ]]; then
            echo "稳定版远程版本不是更新版本，跳过构建"
            echo "远程: $CURRENT"
            echo "本地: $LOCAL"
          fi

          echo "need_build=${NEED}" >> "$GITHUB_OUTPUT"

      - name: 读取测试版记录
        id: testing_local
        run: |
          RECORD_FILE=".github/version/testing.json"

          if [ -f "$RECORD_FILE" ]; then
            VERSION=$(jq -r '.version // ""' "$RECORD_FILE")
            PUBLISHED_AT=$(jq -r '.published_at // ""' "$RECORD_FILE")
          else
            VERSION=""
            PUBLISHED_AT=""
          fi

          {
            echo "version=${VERSION}"
            echo "published_at=${PUBLISHED_AT}"
          } >> "$GITHUB_OUTPUT"

      - name: 获取测试版版本号
        id: testing_version
        if: steps.build_request.outputs.channel == 'both' || steps.build_request.outputs.channel == 'testing'
        env:
          LOCAL_VERSION: ${{ steps.testing_local.outputs.version }}
          REQUESTED_VERSION: ${{ steps.build_request.outputs.version }}
        run: |
          RELEASES_JSON="$RUNNER_TEMP/testing-releases.json"
          TAGS_JSON="$RUNNER_TEMP/testing-tags.json"
          TAG_PUBLISHED_AT="$(TZ=Asia/Shanghai date +'%Y-%m-%dT%H:%M:%S+08:00')"
          RELEASES_URL="https://api.github.com/repos/${{ env.UPSTREAM_RELEASES_REPO }}/releases?per_page=100"
          if [[ -n "$REQUESTED_VERSION" ]]; then
            RELEASES_URL="https://api.github.com/repos/${{ env.UPSTREAM_RELEASES_REPO }}/releases/tags/$REQUESTED_VERSION"
          fi

          curl -fsSL \
            --retry 3 \
            --retry-delay 2 \
            --retry-all-errors \
            --connect-timeout 15 \
            --max-time 120 \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$RELEASES_URL" \
            -o "$RELEASES_JSON"

          if SELECTED="$(bash scripts/select-upstream-version.sh testing "$RELEASES_JSON" "" "$LOCAL_VERSION" "$TAG_PUBLISHED_AT" "$REQUESTED_VERSION")"; then
            :
          else
            STATUS=$?
            if [[ "$STATUS" -ne 3 ]]; then
              exit "$STATUS"
            fi

            curl -fsSL \
              --retry 3 \
              --retry-delay 2 \
              --retry-all-errors \
              --connect-timeout 15 \
              --max-time 120 \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${{ github.token }}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${{ env.UPSTREAM_RELEASES_REPO }}/tags?per_page=100" \
              -o "$TAGS_JSON"

            SELECTED="$(bash scripts/select-upstream-version.sh testing "$RELEASES_JSON" "$TAGS_JSON" "$LOCAL_VERSION" "$TAG_PUBLISHED_AT" "$REQUESTED_VERSION")"
          fi

          VERSION="$(jq -r '.version' <<< "$SELECTED")"
          PUBLISHED_AT="$(jq -r '.published_at' <<< "$SELECTED")"
          DOCKER_TAG="$(jq -r '.docker_tag' <<< "$SELECTED")"
          SOURCE="$(jq -r '.source' <<< "$SELECTED")"

          {
            echo "version=${VERSION}"
            echo "published_at=${PUBLISHED_AT}"
            echo "docker_tag=${DOCKER_TAG}"
          } >> "$GITHUB_OUTPUT"
          echo "testing upstream version: ${VERSION}"
          echo "testing upstream published at: ${PUBLISHED_AT}"
          echo "testing upstream source: ${SOURCE}"
          echo "testing Docker tag: ${DOCKER_TAG}"

      - name: 检查测试版是否需要构建
        id: testing_check
        if: steps.build_request.outputs.channel == 'both' || steps.build_request.outputs.channel == 'testing'
        env:
          REQUESTED_VERSION: ${{ steps.build_request.outputs.version }}
          SELECTED_BRANCH: ${{ github.event.inputs.branch || 'both' }}
          CURRENT: ${{ steps.testing_version.outputs.version }}
          LOCAL: ${{ steps.testing_local.outputs.version }}
        run: |
          NEED="false"

          source scripts/version-key.sh
          CURRENT_KEY="$(version_key "$CURRENT")"
          LOCAL_KEY=""
          if [[ -n "$LOCAL" && -z "${REQUESTED_VERSION:-}" ]]; then
            LOCAL_KEY="$(version_key "$LOCAL")"
          fi

          if [[ "$SELECTED_BRANCH" != "both" && "$SELECTED_BRANCH" != "testing" ]]; then
            echo "手动触发选择了 ${SELECTED_BRANCH}，跳过测试版"
          elif [[ -n "$REQUESTED_VERSION" ]]; then
            NEED="true"
            echo "构建指定测试版 $CURRENT"
          elif [[ "${{ github.event.inputs.force_build }}" == "true" ]]; then
            NEED="true"
            echo "强制构建测试版"
          elif [[ "$CURRENT_KEY" > "$LOCAL_KEY" ]]; then
            NEED="true"
            echo "检测到测试版新版本"
            echo "远程: $CURRENT"
            echo "本地: $LOCAL"
          elif [[ "$CURRENT" != "$LOCAL" ]]; then
            echo "测试版远程版本不是更新版本，跳过构建"
            echo "远程: $CURRENT"
            echo "本地: $LOCAL"
          fi

          echo "need_build=${NEED}" >> "$GITHUB_OUTPUT"

      - name: 判断是否更新渠道浮动标签与版本记录
        id: channel_update
        env:
          REQUESTED_VERSION: ${{ steps.build_request.outputs.version }}
          CHANNEL: ${{ steps.build_request.outputs.channel }}
        run: |
          UPDATE_CHANNEL=true
          if [[ -n "$REQUESTED_VERSION" ]]; then
            UPDATE_CHANNEL=false
            RELEASES_DIR="$(mktemp -d "$RUNNER_TEMP/latest-channel-releases.XXXXXX")"
            PAGE=1
            while :; do
              PAGE_JSON="$RELEASES_DIR/$PAGE.json"
              curl -fsSL \
                --retry 3 \
                --retry-delay 2 \
                --retry-all-errors \
                --connect-timeout 15 \
                --max-time 120 \
                -H "Accept: application/vnd.github+json" \
                -H "Authorization: Bearer ${{ github.token }}" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "https://api.github.com/repos/${{ env.UPSTREAM_RELEASES_REPO }}/releases?per_page=100&page=$PAGE" \
                -o "$PAGE_JSON"
              PAGE_SIZE="$(jq -es '
                if length == 1 and (.[0] | type) == "array" then .[0] | length
                else error("expected one releases array") end
              ' "$PAGE_JSON")"
              [[ "$PAGE_SIZE" -eq 100 ]] || break
              PAGE=$((PAGE + 1))
            done
            RELEASES_JSON="$RUNNER_TEMP/latest-channel-releases.json"
            jq -s 'add' "$RELEASES_DIR"/*.json > "$RELEASES_JSON"
            if LATEST="$(bash scripts/select-upstream-version.sh "$CHANNEL" "$RELEASES_JSON")"; then
              source scripts/version-key.sh
              REQUESTED_KEY="$(version_key "$REQUESTED_VERSION")"
              LATEST_KEY="$(version_key "$(jq -r '.version' <<< "$LATEST")")"
              if [[ "$REQUESTED_KEY" == "$LATEST_KEY" ]]; then
                UPDATE_CHANNEL=true
              fi
            else
              STATUS=$?
              [[ "$STATUS" -eq 3 ]] || exit "$STATUS"
            fi
          fi
          echo "update_channel=$UPDATE_CHANNEL" >> "$GITHUB_OUTPUT"

  # ==================== 构建稳定版 ====================
  prepare_stable:
    name: 准备稳定版二进制镜像构建
    runs-on: ubuntu-latest
    needs: check_versions
    if: >-
      needs.check_versions.outputs.stable_need_build == 'true' &&
      (github.event_name != 'workflow_dispatch' || github.event.inputs.branch == 'both' || github.event.inputs.branch == 'stable')
    outputs:
      source_commit: ${{ steps.source.outputs.source_commit }}
      dockerfile_sha256: ${{ steps.source.outputs.dockerfile_sha256 }}
      source_version: ${{ steps.source.outputs.source_version }}
    steps:
      - name: 固定上游 Dockerfile.binary
        id: source
        env:
          EXPECTED_VERSION: ${{ needs.check_versions.outputs.stable_version }}
        run: |
          git clone --depth 1 --branch "${{ env.UPSTREAM_STABLE_BRANCH }}" "${{ env.UPSTREAM_REPO }}" src
          test -f src/Dockerfile.binary
          {
            echo "source_commit=$(git -C src rev-parse HEAD)"
            echo "dockerfile_sha256=$(sha256sum src/Dockerfile.binary | cut -d' ' -f1)"
            echo "source_version=${EXPECTED_VERSION#[vV]}"
          } >> "$GITHUB_OUTPUT"

  build_stable:
    name: 构建稳定版镜像 (${{ matrix.platform }})
    runs-on: ubuntu-latest
    needs: [check_versions, prepare_stable]
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            slug: amd64
          - platform: linux/arm64
            slug: arm64
    permissions:
      contents: read
      packages: write
    if: >-
      needs.check_versions.outputs.stable_need_build == 'true' &&
      (github.event_name != 'workflow_dispatch' || github.event.inputs.branch == 'both' || github.event.inputs.branch == 'stable')
    steps:
      - name: Checkout Current Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: repo-tools
          ref: ${{ github.sha }}
      - name: 克隆上游代码
        run: |
          echo "克隆并验证固定上游提交 ${{ needs.prepare_stable.outputs.source_commit }}..."
          for attempt in 1 2 3; do
            rm -rf src
            if git init src && git -C src remote add origin "${{ env.UPSTREAM_REPO }}" &&
              git -C src fetch --depth 1 --tags origin "${{ needs.prepare_stable.outputs.source_commit }}" &&
              git -C src checkout --detach FETCH_HEAD; then
              break
            fi
            [[ "$attempt" -lt 3 ]] || exit 1
            sleep $((attempt * 2))
          done
          [[ "$(git -C src rev-parse HEAD)" == "${{ needs.prepare_stable.outputs.source_commit }}" ]]
          [[ "$(sha256sum src/Dockerfile.binary | cut -d' ' -f1)" == "${{ needs.prepare_stable.outputs.dockerfile_sha256 }}" ]]
          echo "代码克隆完成"

      - name: 下载稳定版发布二进制
        env:
          RELEASE_VERSION: ${{ needs.check_versions.outputs.stable_version }}
          GITHUB_TOKEN: ${{ github.token }}
        run: bash repo-tools/scripts/download-release-binary.sh "$RELEASE_VERSION" "${{ matrix.slug }}" src

      - name: Setup QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]

      - name: Login to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: cary17
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 构建并推送稳定版单架构镜像到 GHCR
        id: build_ghcr
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: src
          file: src/Dockerfile.binary
          platforms: ${{ matrix.platform }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=stable-${{ matrix.slug }}
          cache-to: type=gha,mode=max,scope=stable-${{ matrix.slug }}
          outputs: type=image,name=${{ env.GHCR_IMAGE }},push-by-digest=true,name-canonical=true,push=true
      - name: 构建并推送稳定版单架构镜像到 Docker Hub
        id: build_dockerhub
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: src
          file: src/Dockerfile.binary
          platforms: ${{ matrix.platform }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=stable-${{ matrix.slug }}
          outputs: type=image,name=${{ env.DOCKERHUB_IMAGE }},push-by-digest=true,name-canonical=true,push=true
      - name: 保存稳定版单架构 digest
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          printf '%s\n' '${{ steps.build_ghcr.outputs.digest }}' > "$RUNNER_TEMP/digests/ghcr-${{ matrix.slug }}"
          printf '%s\n' '${{ steps.build_dockerhub.outputs.digest }}' > "$RUNNER_TEMP/digests/dockerhub-${{ matrix.slug }}"
      - name: 上传稳定版 digest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stable-digest-${{ matrix.slug }}
          path: ${{ runner.temp }}/digests/*-${{ matrix.slug }}
          if-no-files-found: error
          retention-days: 1

  # ==================== 构建测试版 ====================
  prepare_testing:
    name: 准备测试版二进制镜像构建
    runs-on: ubuntu-latest
    needs: check_versions
    if: >-
      needs.check_versions.outputs.testing_need_build == 'true' &&
      (github.event_name != 'workflow_dispatch' || github.event.inputs.branch == 'both' || github.event.inputs.branch == 'testing')
    outputs:
      source_commit: ${{ steps.source.outputs.source_commit }}
      dockerfile_sha256: ${{ steps.source.outputs.dockerfile_sha256 }}
      source_version: ${{ steps.source.outputs.source_version }}
    steps:
      - name: 固定上游 Dockerfile.binary
        id: source
        env:
          EXPECTED_VERSION: ${{ needs.check_versions.outputs.testing_version }}
        run: |
          git clone --depth 1 --branch "${{ env.UPSTREAM_TESTING_BRANCH }}" "${{ env.UPSTREAM_REPO }}" src
          test -f src/Dockerfile.binary
          {
            echo "source_commit=$(git -C src rev-parse HEAD)"
            echo "dockerfile_sha256=$(sha256sum src/Dockerfile.binary | cut -d' ' -f1)"
            echo "source_version=${EXPECTED_VERSION#[vV]}"
          } >> "$GITHUB_OUTPUT"

  build_testing:
    name: 构建测试版镜像 (${{ matrix.platform }})
    runs-on: ubuntu-latest
    needs: [check_versions, prepare_testing]
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            slug: amd64
          - platform: linux/arm64
            slug: arm64
    permissions:
      contents: read
      packages: write
    if: >-
      needs.check_versions.outputs.testing_need_build == 'true' &&
      (github.event_name != 'workflow_dispatch' || github.event.inputs.branch == 'both' || github.event.inputs.branch == 'testing')
    steps:
      - name: Checkout Current Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: repo-tools
          ref: ${{ github.sha }}

      - name: 克隆上游代码
        run: |
          echo "克隆并验证固定上游提交 ${{ needs.prepare_testing.outputs.source_commit }}..."
          for attempt in 1 2 3; do
            rm -rf src
            if git init src && git -C src remote add origin "${{ env.UPSTREAM_REPO }}" &&
              git -C src fetch --depth 1 --tags origin "${{ needs.prepare_testing.outputs.source_commit }}" &&
              git -C src checkout --detach FETCH_HEAD; then
              break
            fi
            [[ "$attempt" -lt 3 ]] || exit 1
            sleep $((attempt * 2))
          done
          [[ "$(git -C src rev-parse HEAD)" == "${{ needs.prepare_testing.outputs.source_commit }}" ]]
          [[ "$(sha256sum src/Dockerfile.binary | cut -d' ' -f1)" == "${{ needs.prepare_testing.outputs.dockerfile_sha256 }}" ]]
          echo "代码克隆完成"

      - name: 下载测试版发布二进制
        env:
          RELEASE_VERSION: ${{ needs.check_versions.outputs.testing_version }}
          GITHUB_TOKEN: ${{ github.token }}
        run: bash repo-tools/scripts/download-release-binary.sh "$RELEASE_VERSION" "${{ matrix.slug }}" src

      - name: Setup QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]

      - name: Login to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: cary17
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 构建并推送测试版单架构镜像到 GHCR
        id: build_ghcr
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: src
          file: src/Dockerfile.binary
          platforms: ${{ matrix.platform }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=testing-${{ matrix.slug }}
          cache-to: type=gha,mode=max,scope=testing-${{ matrix.slug }}
          outputs: type=image,name=${{ env.GHCR_IMAGE }},push-by-digest=true,name-canonical=true,push=true
      - name: 构建并推送测试版单架构镜像到 Docker Hub
        id: build_dockerhub
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: src
          file: src/Dockerfile.binary
          platforms: ${{ matrix.platform }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=testing-${{ matrix.slug }}
          outputs: type=image,name=${{ env.DOCKERHUB_IMAGE }},push-by-digest=true,name-canonical=true,push=true
      - name: 保存测试版单架构 digest
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          printf '%s\n' '${{ steps.build_ghcr.outputs.digest }}' > "$RUNNER_TEMP/digests/ghcr-${{ matrix.slug }}"
          printf '%s\n' '${{ steps.build_dockerhub.outputs.digest }}' > "$RUNNER_TEMP/digests/dockerhub-${{ matrix.slug }}"
      - name: 上传测试版 digest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: testing-digest-${{ matrix.slug }}
          path: ${{ runner.temp }}/digests/*-${{ matrix.slug }}
          if-no-files-found: error
          retention-days: 1

  merge_stable:
    name: 合并并发布稳定版镜像
    runs-on: ubuntu-latest
    needs: [check_versions, prepare_stable, build_stable]
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout Current Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Login to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Login to Docker Hub
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: cary17
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: 下载稳定版 digest
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/digests
          pattern: stable-digest-*
          merge-multiple: true
      - name: 合并并校验稳定版清单
        id: merge
        run: |
          bash scripts/merge-channel-manifests.sh stable \
            "${{ needs.check_versions.outputs.stable_docker_tag }}" \
            "${{ env.GHCR_IMAGE }}" "${{ env.DOCKERHUB_IMAGE }}" "${{ needs.check_versions.outputs.update_channel == 'true' && 'latest,stable' || '' }}" \
            "$RUNNER_TEMP/digests" "${{ needs.prepare_stable.outputs.source_version }}"
      - name: 更新稳定版版本记录
        if: needs.check_versions.outputs.update_channel == 'true'
        run: |
          bash scripts/update-version-record.sh stable \
            "${{ needs.check_versions.outputs.stable_version }}" \
            "${{ needs.check_versions.outputs.stable_published_at }}" \
            "${{ needs.check_versions.outputs.stable_docker_tag }}" \
            "${{ env.UPSTREAM_STABLE_BRANCH }}" \
            "${{ needs.prepare_stable.outputs.source_commit }}" \
            "${{ needs.prepare_stable.outputs.dockerfile_sha256 }}" \
            "${{ steps.merge.outputs.ghcr_digest }}" \
            "${{ steps.merge.outputs.dockerhub_digest }}"

  merge_testing:
