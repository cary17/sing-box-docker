name: Build reF1nd Sing-Box Docker Images

on:
  schedule:
    # Every 6 hours.
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      force_build:
        description: "强制构建"
        required: false
        default: false
        type: boolean
      branch:
        description: "选择分支"
        required: false
        default: "both"
        type: choice
        options:
          - both
          - stable
          - testing
      stable_upstream_branch:
        description: "稳定版上游分支"
        required: false
        default: "reF1nd-stable"
        type: choice
        options:
          - reF1nd-stable
          - reF1nd-stable-next
      testing_upstream_branch:
        description: "测试版上游分支"
        required: false
        default: "reF1nd-testing"
        type: choice
        options:
          - reF1nd-testing
          - reF1nd-testing-next

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  # 手动构建优先；新的手动运行会取消旧运行，定时运行不会打断正在执行的构建。
  cancel-in-progress: ${{ github.event_name == 'workflow_dispatch' }}

env:
  # 上游仓库配置
  UPSTREAM_REPO: "https://github.com/reF1nd/sing-box.git"
  UPSTREAM_STABLE_BRANCH: "${{ github.event.inputs.stable_upstream_branch || 'reF1nd-stable' }}"
  UPSTREAM_TESTING_BRANCH: "${{ github.event.inputs.testing_upstream_branch || 'reF1nd-testing' }}"
  UPSTREAM_RELEASES_REPO: "reF1nd/sing-box-releases"
  UPSTREAM_SOURCE_REPO: "reF1nd/sing-box"

  # 镜像仓库配置
  GHCR_IMAGE: "ghcr.io/${{ github.repository_owner }}/sing-box"
  DOCKERHUB_IMAGE: "cary17/sing-box"

jobs:
  # ==================== 检测版本 ====================
  check_versions:
    name: 检测上游版本
    runs-on: ubuntu-latest
    outputs:
      stable_version: ${{ steps.stable_version.outputs.version }}
      stable_published_at: ${{ steps.stable_version.outputs.published_at }}
      stable_docker_tag: ${{ steps.stable_version.outputs.docker_tag }}
      testing_version: ${{ steps.testing_version.outputs.version }}
      testing_published_at: ${{ steps.testing_version.outputs.published_at }}
      testing_docker_tag: ${{ steps.testing_version.outputs.docker_tag }}
      stable_need_build: ${{ steps.stable_check.outputs.need_build }}
      testing_need_build: ${{ steps.testing_check.outputs.need_build }}
    steps:
      - name: Checkout Current Repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: 读取稳定版记录
        id: stable_local
        run: |
          RECORD_FILE=".github/version/stable.json"

          if [ -f "$RECORD_FILE" ]; then
            VERSION=$(jq -r '.version // ""' "$RECORD_FILE")
            PUBLISHED_AT=$(jq -r '.published_at // ""' "$RECORD_FILE")
          else
            VERSION=""
            PUBLISHED_AT=""
          fi

          {
            echo "version=${VERSION}"
            echo "published_at=${PUBLISHED_AT}"
          } >> "$GITHUB_OUTPUT"

      - name: 获取稳定版版本号
        id: stable_version
        env:
          LOCAL_VERSION: ${{ steps.stable_local.outputs.version }}
        run: |
          RELEASES_JSON="$RUNNER_TEMP/stable-releases.json"
          TAGS_JSON="$RUNNER_TEMP/stable-tags.json"
          TAG_PUBLISHED_AT="$(TZ=Asia/Shanghai date +'%Y-%m-%dT%H:%M:%S+08:00')"

          curl -fsSL \
            --retry 3 \
            --retry-delay 2 \
            --retry-all-errors \
            --connect-timeout 15 \
            --max-time 120 \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ env.UPSTREAM_RELEASES_REPO }}/releases?per_page=100" \
            -o "$RELEASES_JSON"

          if SELECTED="$(bash scripts/select-upstream-version.sh stable "$RELEASES_JSON" "" "$LOCAL_VERSION" "$TAG_PUBLISHED_AT")"; then
            :
          else
            STATUS=$?
            if [[ "$STATUS" -ne 3 ]]; then
              exit "$STATUS"
            fi

            curl -fsSL \
              --retry 3 \
              --retry-delay 2 \
              --retry-all-errors \
              --connect-timeout 15 \
              --max-time 120 \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${{ github.token }}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${{ env.UPSTREAM_RELEASES_REPO }}/tags?per_page=100" \
              -o "$TAGS_JSON"

            SELECTED="$(bash scripts/select-upstream-version.sh stable "$RELEASES_JSON" "$TAGS_JSON" "$LOCAL_VERSION" "$TAG_PUBLISHED_AT")"
          fi

          VERSION="$(jq -r '.version' <<< "$SELECTED")"
          PUBLISHED_AT="$(jq -r '.published_at' <<< "$SELECTED")"
          DOCKER_TAG="$(jq -r '.docker_tag' <<< "$SELECTED")"
          SOURCE="$(jq -r '.source' <<< "$SELECTED")"

          {
            echo "version=${VERSION}"
            echo "published_at=${PUBLISHED_AT}"
            echo "docker_tag=${DOCKER_TAG}"
          } >> "$GITHUB_OUTPUT"
          echo "stable upstream version: ${VERSION}"
          echo "stable upstream published at: ${PUBLISHED_AT}"
          echo "stable upstream source: ${SOURCE}"
          echo "stable Docker tag: ${DOCKER_TAG}"

      - name: 检查稳定版是否需要构建
        id: stable_check
        env:
          SELECTED_BRANCH: ${{ github.event.inputs.branch || 'both' }}
          CURRENT: ${{ steps.stable_version.outputs.version }}
          LOCAL: ${{ steps.stable_local.outputs.version }}
        run: |
          NEED="false"

          version_gt() {
            [[ -z "$2" ]] && return 0
            [[ "$1" == "$2" ]] && return 1

            version_key() {
              local tag="${1#v}"
              tag="${tag#V}"
              local base="${tag%%-reF1nd*}"
              local suffix="${tag#*-reF1nd}"
              local version_part prerelease_part prerelease_name major minor patch prerelease_rank prerelease_number revision

              if [[ "$base" == *-* ]]; then
                version_part="${base%%-*}"
                prerelease_part="${base#*-}"
                prerelease_name="${prerelease_part%%.*}"
                case "${prerelease_name,,}" in
                  alpha) prerelease_rank=1 ;;
                  beta) prerelease_rank=2 ;;
                  rc) prerelease_rank=3 ;;
                  *) prerelease_rank=0 ;;
                esac
                prerelease_number="${prerelease_part##*.}"
                [[ "$prerelease_number" =~ ^[0-9]+$ ]] || prerelease_number=0
              else
                version_part="$base"
                prerelease_rank=99999999
                prerelease_number=99999999
              fi

              IFS=. read -r major minor patch _ <<< "$version_part"
              if [[ "$suffix" == "$tag" || -z "$suffix" ]]; then
                revision=0
              else
                revision="${suffix#.}"
                [[ "$revision" =~ ^[0-9]+$ ]] || revision=0
              fi

              printf '%08d.%08d.%08d.%08d.%08d.%08d' "${major:-0}" "${minor:-0}" "${patch:-0}" "${prerelease_rank:-0}" "${prerelease_number:-0}" "${revision:-0}"
            }

            [[ "$(version_key "$1")" > "$(version_key "$2")" ]]
          }

          if [[ "$SELECTED_BRANCH" != "both" && "$SELECTED_BRANCH" != "stable" ]]; then
            echo "手动触发选择了 ${SELECTED_BRANCH}，跳过稳定版"
          elif [[ "${{ github.event.inputs.force_build }}" == "true" ]]; then
            NEED="true"
            echo "强制构建稳定版"
          elif version_gt "$CURRENT" "$LOCAL"; then
            NEED="true"
            echo "检测到稳定版新版本"
            echo "远程: $CURRENT"
            echo "本地: $LOCAL"
          elif [[ "$CURRENT" != "$LOCAL" ]]; then
            echo "稳定版远程版本不是更新版本，跳过构建"
            echo "远程: $CURRENT"
            echo "本地: $LOCAL"
          fi

          echo "need_build=${NEED}" >> "$GITHUB_OUTPUT"

      - name: 读取测试版记录
        id: testing_local
        run: |
          RECORD_FILE=".github/version/testing.json"

          if [ -f "$RECORD_FILE" ]; then
            VERSION=$(jq -r '.version // ""' "$RECORD_FILE")
            PUBLISHED_AT=$(jq -r '.published_at // ""' "$RECORD_FILE")
          else
            VERSION=""
            PUBLISHED_AT=""
          fi

          {
            echo "version=${VERSION}"
            echo "published_at=${PUBLISHED_AT}"
          } >> "$GITHUB_OUTPUT"

      - name: 获取测试版版本号
        id: testing_version
        env:
          LOCAL_VERSION: ${{ steps.testing_local.outputs.version }}
        run: |
          RELEASES_JSON="$RUNNER_TEMP/testing-releases.json"
          TAGS_JSON="$RUNNER_TEMP/testing-tags.json"
          TAG_PUBLISHED_AT="$(TZ=Asia/Shanghai date +'%Y-%m-%dT%H:%M:%S+08:00')"

          curl -fsSL \
            --retry 3 \
            --retry-delay 2 \
            --retry-all-errors \
            --connect-timeout 15 \
            --max-time 120 \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ env.UPSTREAM_RELEASES_REPO }}/releases?per_page=100" \
            -o "$RELEASES_JSON"

          if SELECTED="$(bash scripts/select-upstream-version.sh testing "$RELEASES_JSON" "" "$LOCAL_VERSION" "$TAG_PUBLISHED_AT")"; then
            :
          else
            STATUS=$?
            if [[ "$STATUS" -ne 3 ]]; then
              exit "$STATUS"
            fi

            curl -fsSL \
              --retry 3 \
              --retry-delay 2 \
              --retry-all-errors \
              --connect-timeout 15 \
              --max-time 120 \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${{ github.token }}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${{ env.UPSTREAM_RELEASES_REPO }}/tags?per_page=100" \
              -o "$TAGS_JSON"

            SELECTED="$(bash scripts/select-upstream-version.sh testing "$RELEASES_JSON" "$TAGS_JSON" "$LOCAL_VERSION" "$TAG_PUBLISHED_AT")"
          fi

          VERSION="$(jq -r '.version' <<< "$SELECTED")"
          PUBLISHED_AT="$(jq -r '.published_at' <<< "$SELECTED")"
          DOCKER_TAG="$(jq -r '.docker_tag' <<< "$SELECTED")"
          SOURCE="$(jq -r '.source' <<< "$SELECTED")"

          {
            echo "version=${VERSION}"
            echo "published_at=${PUBLISHED_AT}"
            echo "docker_tag=${DOCKER_TAG}"
          } >> "$GITHUB_OUTPUT"
          echo "testing upstream version: ${VERSION}"
          echo "testing upstream published at: ${PUBLISHED_AT}"
          echo "testing upstream source: ${SOURCE}"
          echo "testing Docker tag: ${DOCKER_TAG}"

      - name: 检查测试版是否需要构建
        id: testing_check
        env:
          SELECTED_BRANCH: ${{ github.event.inputs.branch || 'both' }}
          CURRENT: ${{ steps.testing_version.outputs.version }}
          LOCAL: ${{ steps.testing_local.outputs.version }}
        run: |
          NEED="false"

          version_gt() {
            [[ -z "$2" ]] && return 0
            [[ "$1" == "$2" ]] && return 1

            version_key() {
              local tag="${1#v}"
              tag="${tag#V}"
              local base="${tag%%-reF1nd*}"
              local suffix="${tag#*-reF1nd}"
              local version_part prerelease_part prerelease_name major minor patch prerelease_rank prerelease_number revision

              if [[ "$base" == *-* ]]; then
                version_part="${base%%-*}"
                prerelease_part="${base#*-}"
                prerelease_name="${prerelease_part%%.*}"
                case "${prerelease_name,,}" in
                  alpha) prerelease_rank=1 ;;
                  beta) prerelease_rank=2 ;;
                  rc) prerelease_rank=3 ;;
                  *) prerelease_rank=0 ;;
                esac
                prerelease_number="${prerelease_part##*.}"
                [[ "$prerelease_number" =~ ^[0-9]+$ ]] || prerelease_number=0
              else
                version_part="$base"
                prerelease_rank=99999999
                prerelease_number=99999999
              fi

              IFS=. read -r major minor patch _ <<< "$version_part"
              if [[ "$suffix" == "$tag" || -z "$suffix" ]]; then
                revision=0
              else
                revision="${suffix#.}"
                [[ "$revision" =~ ^[0-9]+$ ]] || revision=0
              fi

              printf '%08d.%08d.%08d.%08d.%08d.%08d' "${major:-0}" "${minor:-0}" "${patch:-0}" "${prerelease_rank:-0}" "${prerelease_number:-0}" "${revision:-0}"
            }

            [[ "$(version_key "$1")" > "$(version_key "$2")" ]]
          }

          if [[ "$SELECTED_BRANCH" != "both" && "$SELECTED_BRANCH" != "testing" ]]; then
            echo "手动触发选择了 ${SELECTED_BRANCH}，跳过测试版"
          elif [[ "${{ github.event.inputs.force_build }}" == "true" ]]; then
            NEED="true"
            echo "强制构建测试版"
          elif version_gt "$CURRENT" "$LOCAL"; then
            NEED="true"
            echo "检测到测试版新版本"
            echo "远程: $CURRENT"
            echo "本地: $LOCAL"
          elif [[ "$CURRENT" != "$LOCAL" ]]; then
            echo "测试版远程版本不是更新版本，跳过构建"
            echo "远程: $CURRENT"
            echo "本地: $LOCAL"
          fi

          echo "need_build=${NEED}" >> "$GITHUB_OUTPUT"

  # ==================== 构建稳定版 ====================
  prepare_stable:
    name: 准备稳定版源码
    runs-on: ubuntu-latest
    needs: check_versions
    if: >-
      needs.check_versions.outputs.stable_need_build == 'true' &&
      (github.event_name != 'workflow_dispatch' || github.event.inputs.branch == 'both' || github.event.inputs.branch == 'stable')
    outputs:
      source_commit: ${{ steps.source.outputs.source_commit }}
      dockerfile_sha256: ${{ steps.source.outputs.dockerfile_sha256 }}
      ebpf_dockerfile_sha256: ${{ steps.ebpf.outputs.sha256 }}
      source_version: ${{ steps.source.outputs.source_version }}
    steps:
      - name: Checkout Current Repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: repo-tools
          ref: ${{ github.ref_name }}
      - name: 固定上游源码
        id: source
        run: |
          git clone --depth 1 --branch "${{ env.UPSTREAM_STABLE_BRANCH }}" "${{ env.UPSTREAM_REPO }}" src
          {
            echo "source_commit=$(git -C src rev-parse HEAD)"
            echo "dockerfile_sha256=$(sha256sum src/Dockerfile | cut -d' ' -f1)"
            echo "source_version=$(cd src && go run ./cmd/internal/read_tag)"
          } >> "$GITHUB_OUTPUT"
      - name: 生成稳定版 eBPF Dockerfile 摘要
        id: ebpf
        run: |
          bash repo-tools/scripts/prepare-ebpf-dockerfile.sh src/Dockerfile src/Dockerfile.ebpf
          echo "sha256=$(sha256sum src/Dockerfile.ebpf | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

  build_stable:
    name: 构建稳定版镜像 (${{ matrix.platform }})
    runs-on: ubuntu-latest
    needs: [check_versions, prepare_stable]
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            slug: amd64
          - platform: linux/arm64
            slug: arm64
          - platform: linux/386
            slug: 386
          - platform: linux/arm/v7
            slug: arm-v7
          - platform: linux/arm/v6
            slug: arm-v6
    permissions:
      contents: write
      packages: write
    if: >-
      needs.check_versions.outputs.stable_need_build == 'true' &&
      (github.event_name != 'workflow_dispatch' || github.event.inputs.branch == 'both' || github.event.inputs.branch == 'stable')
    steps:
      - name: Checkout Current Repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: repo-tools
          ref: ${{ github.ref_name }}
      - name: 克隆上游代码
        run: |
          echo "克隆并验证固定上游提交 ${{ needs.prepare_stable.outputs.source_commit }}..."
          for attempt in 1 2 3; do
            rm -rf src
            if git clone --depth 1 --branch "${{ env.UPSTREAM_STABLE_BRANCH }}" \
              "${{ env.UPSTREAM_REPO }}" src; then
              break
            fi
            [[ "$attempt" -lt 3 ]] || exit 1
            sleep $((attempt * 2))
          done
          [[ "$(git -C src rev-parse HEAD)" == "${{ needs.prepare_stable.outputs.source_commit }}" ]]
          [[ "$(sha256sum src/Dockerfile | cut -d' ' -f1)" == "${{ needs.prepare_stable.outputs.dockerfile_sha256 }}" ]]
          echo "代码克隆完成"

      - name: 生成稳定版 eBPF Dockerfile
        run: |
          bash repo-tools/scripts/prepare-ebpf-dockerfile.sh src/Dockerfile src/Dockerfile.ebpf
          [[ "$(sha256sum src/Dockerfile.ebpf | cut -d' ' -f1)" == "${{ needs.prepare_stable.outputs.ebpf_dockerfile_sha256 }}" ]]

      - name: Setup QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: cary17
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 构建并推送稳定版单架构镜像到 GHCR
        id: build_ghcr
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: src
          file: src/Dockerfile.ebpf
          platforms: ${{ matrix.platform }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=stable-${{ matrix.slug }}
          cache-to: type=gha,mode=max,scope=stable-${{ matrix.slug }}
          outputs: type=image,name=${{ env.GHCR_IMAGE }},push-by-digest=true,name-canonical=true,push=true
      - name: 构建并推送稳定版单架构镜像到 Docker Hub
        id: build_dockerhub
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: src
          file: src/Dockerfile.ebpf
          platforms: ${{ matrix.platform }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=stable-${{ matrix.slug }}
          outputs: type=image,name=${{ env.DOCKERHUB_IMAGE }},push-by-digest=true,name-canonical=true,push=true
      - name: 保存稳定版单架构 digest
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          printf '%s\n' '${{ steps.build_ghcr.outputs.digest }}' > "$RUNNER_TEMP/digests/ghcr-${{ matrix.slug }}"
          printf '%s\n' '${{ steps.build_dockerhub.outputs.digest }}' > "$RUNNER_TEMP/digests/dockerhub-${{ matrix.slug }}"
      - name: 上传稳定版 digest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: stable-digest-${{ matrix.slug }}
          path: ${{ runner.temp }}/digests/*-${{ matrix.slug }}
          if-no-files-found: error
          retention-days: 1

  # ==================== 构建测试版 ====================
  prepare_testing:
    name: 准备测试版源码
    runs-on: ubuntu-latest
    needs: check_versions
    if: >-
      needs.check_versions.outputs.testing_need_build == 'true' &&
      (github.event_name != 'workflow_dispatch' || github.event.inputs.branch == 'both' || github.event.inputs.branch == 'testing')
    outputs:
      source_commit: ${{ steps.source.outputs.source_commit }}
      dockerfile_sha256: ${{ steps.source.outputs.dockerfile_sha256 }}
      ebpf_dockerfile_sha256: ${{ steps.ebpf.outputs.sha256 }}
      source_version: ${{ steps.source.outputs.source_version }}
    steps:
      - name: Checkout Current Repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: repo-tools
          ref: ${{ github.ref_name }}
      - name: 固定上游源码并验证 eBPF Dockerfile
        id: source
        run: |
          git clone --depth 1 --branch "${{ env.UPSTREAM_TESTING_BRANCH }}" "${{ env.UPSTREAM_REPO }}" src
          {
            echo "source_commit=$(git -C src rev-parse HEAD)"
            echo "dockerfile_sha256=$(sha256sum src/Dockerfile | cut -d' ' -f1)"
            echo "source_version=$(cd src && go run ./cmd/internal/read_tag)"
          } >> "$GITHUB_OUTPUT"
      - name: 生成 eBPF Dockerfile 摘要
        id: ebpf
        run: |
          bash repo-tools/scripts/prepare-ebpf-dockerfile.sh src/Dockerfile src/Dockerfile.ebpf
          echo "sha256=$(sha256sum src/Dockerfile.ebpf | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

  build_testing:
    name: 构建测试版镜像 (${{ matrix.platform }})
    runs-on: ubuntu-latest
    needs: [check_versions, prepare_testing]
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            slug: amd64
          - platform: linux/arm64
            slug: arm64
          - platform: linux/386
            slug: 386
          - platform: linux/arm/v7
            slug: arm-v7
          - platform: linux/arm/v6
            slug: arm-v6
    permissions:
      contents: write
      packages: write
    if: >-
      needs.check_versions.outputs.testing_need_build == 'true' &&
      (github.event_name != 'workflow_dispatch' || github.event.inputs.branch == 'both' || github.event.inputs.branch == 'testing')
    steps:
      - name: Checkout Current Repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: repo-tools
          ref: ${{ github.ref_name }}

      - name: 克隆上游代码
        run: |
          echo "克隆并验证固定上游提交 ${{ needs.prepare_testing.outputs.source_commit }}..."
          for attempt in 1 2 3; do
            rm -rf src
            if git clone --depth 1 --branch "${{ env.UPSTREAM_TESTING_BRANCH }}" \
              "${{ env.UPSTREAM_REPO }}" src; then
              break
            fi
            [[ "$attempt" -lt 3 ]] || exit 1
            sleep $((attempt * 2))
          done
          [[ "$(git -C src rev-parse HEAD)" == "${{ needs.prepare_testing.outputs.source_commit }}" ]]
          [[ "$(sha256sum src/Dockerfile | cut -d' ' -f1)" == "${{ needs.prepare_testing.outputs.dockerfile_sha256 }}" ]]
          echo "代码克隆完成"

      - name: 生成 eBPF Dockerfile
        run: |
          bash repo-tools/scripts/prepare-ebpf-dockerfile.sh src/Dockerfile src/Dockerfile.ebpf
          [[ "$(sha256sum src/Dockerfile.ebpf | cut -d' ' -f1)" == "${{ needs.prepare_testing.outputs.ebpf_dockerfile_sha256 }}" ]]

      - name: Setup QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: cary17
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 构建并推送测试版单架构镜像到 GHCR
        id: build_ghcr
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: src
          file: src/Dockerfile.ebpf
          platforms: ${{ matrix.platform }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=testing-${{ matrix.slug }}
          cache-to: type=gha,mode=max,scope=testing-${{ matrix.slug }}
          outputs: type=image,name=${{ env.GHCR_IMAGE }},push-by-digest=true,name-canonical=true,push=true
      - name: 构建并推送测试版单架构镜像到 Docker Hub
        id: build_dockerhub
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: src
          file: src/Dockerfile.ebpf
          platforms: ${{ matrix.platform }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=testing-${{ matrix.slug }}
          outputs: type=image,name=${{ env.DOCKERHUB_IMAGE }},push-by-digest=true,name-canonical=true,push=true
      - name: 保存测试版单架构 digest
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          printf '%s\n' '${{ steps.build_ghcr.outputs.digest }}' > "$RUNNER_TEMP/digests/ghcr-${{ matrix.slug }}"
          printf '%s\n' '${{ steps.build_dockerhub.outputs.digest }}' > "$RUNNER_TEMP/digests/dockerhub-${{ matrix.slug }}"
      - name: 上传测试版 digest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: testing-digest-${{ matrix.slug }}
          path: ${{ runner.temp }}/digests/*-${{ matrix.slug }}
          if-no-files-found: error
          retention-days: 1

  merge_stable:
    name: 合并并发布稳定版镜像
    runs-on: ubuntu-latest
    needs: [check_versions, prepare_stable, build_stable]
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout Current Repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Login to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: cary17
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: 下载稳定版 digest
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: stable-digest-*
          merge-multiple: true
      - name: 合并并校验稳定版清单
        id: merge
        run: |
          bash scripts/merge-channel-manifests.sh stable \
            "${{ needs.check_versions.outputs.stable_docker_tag }}" \
            "${{ env.GHCR_IMAGE }}" "${{ env.DOCKERHUB_IMAGE }}" "latest,stable" \
            "$RUNNER_TEMP/digests"
      - name: 校验稳定版 eBPF 构建特性
        run: |
          VERSION_OUTPUT="$(docker run --rm --platform linux/amd64 \
            "${{ env.GHCR_IMAGE }}:${{ needs.check_versions.outputs.stable_docker_tag }}" version)"
          printf '%s\n' "$VERSION_OUTPUT"
          grep -Fx "sing-box version ${{ needs.prepare_stable.outputs.source_version }}" <<< "$VERSION_OUTPUT"
          sed -n 's/^Tags: //p' <<< "$VERSION_OUTPUT" | tr ',' '\n' | grep -Fx 'with_ebpf'
          grep -Fx 'CGO: disabled' <<< "$VERSION_OUTPUT"
      - name: 更新稳定版版本记录
        run: |
          bash scripts/update-version-record.sh stable \
            "${{ needs.check_versions.outputs.stable_version }}" \
            "${{ needs.check_versions.outputs.stable_published_at }}" \
            "${{ needs.check_versions.outputs.stable_docker_tag }}" \
            "${{ env.UPSTREAM_STABLE_BRANCH }}" \
            "${{ needs.prepare_stable.outputs.source_commit }}" \
            "${{ needs.prepare_stable.outputs.dockerfile_sha256 }}" \
            "${{ needs.prepare_stable.outputs.ebpf_dockerfile_sha256 }}" \
            "${{ steps.merge.outputs.ghcr_digest }}" \
            "${{ steps.merge.outputs.dockerhub_digest }}"

  merge_testing:
