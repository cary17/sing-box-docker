            "${{ env.GHCR_IMAGE }}" "${{ env.DOCKERHUB_IMAGE }}" "${{ needs.check_versions.outputs.update_channel == 'true' && 'testing' || '' }}" \
            "$RUNNER_TEMP/digests" "${{ needs.prepare_testing.outputs.source_version }}"
      - name: 更新测试版版本记录
        if: needs.check_versions.outputs.update_channel == 'true'
        run: |
